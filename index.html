<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AURA Monrovia — Modern Food Delivery & Restaurants</title>
    <meta name="description" content="Order Monrovia food, Jollof, Pepper Soup, Suya, and grills with Lonestar MTN MoMo, Orange Money, or Cash on Delivery across Monrovia, Liberia." />
    
    <!-- PWA & Mobile Web Standards -->
    <meta name="theme-color" content="#FF4B26" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Apple iOS / iPhone Optimization -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AURA Food" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Social Share Cards -->
    <meta property="og:title" content="AURA Monrovia — Modern Food Delivery & Restaurants" />
    <meta property="og:description" content="Order Monrovia food, Jollof, Pepper Soup, Suya, and grills with Lonestar MTN MoMo, Orange Money, or Cash on Delivery across Monrovia, Liberia." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8F9FA] text-[#111827] antialiased selection:bg-[#FF4B26]/20 selection:text-[#FF4B26]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration notice:', err);
          });
        });
      }
    </script>
  </body>
</html>
